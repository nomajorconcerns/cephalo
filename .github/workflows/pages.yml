name: pages

# Publishes the static website (site/index.html, commands.js, stats.js, og.png and the legal pages) to GitHub Pages.
# It copies only the site files, so the backup folder and the rest of the repository are never uploaded.
# Every hour it also rebuilds stats.json (public numbers from npm, GitHub and GoatCounter) with scripts/stats.mjs.

on:
  push:
    branches: [master]
    paths:
      - "site/index.html"
      - "site/commands.js"
      - "site/og.png"
      - "site/legal.css"
      - "site/privacy.html"
      - "site/terms.html"
      - "site/refunds.html"
      - "site/contact.html"
      - "site/stats.js"
      - "scripts/stats.mjs"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Collect the site files
        run: |
          mkdir _site
          cp site/index.html site/commands.js site/stats.js site/checkout.config.js site/checkout.js site/legal.css site/privacy.html site/terms.html site/refunds.html site/contact.html site/og.png _site/
      - name: Build the public numbers (stats.json)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/stats.mjs --out _site/stats.json --prev https://nomajorconcerns.github.io/cephalo/stats.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
