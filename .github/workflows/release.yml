# Release workflow for Cephalo. PREPARED, NOT YET RUN.
#
#   push a tag vX.Y.Z   -> tests on 3 OSes x 3 Node versions, build + sign the tarball, attach it to a DRAFT GitHub release.
#                          Nothing is published to npm by a tag push.
#   run it by hand       -> Actions > release > Run workflow, on a tag, with "publish" ticked: the same build, then a
#   (workflow_dispatch)     separate publish job that waits for approval of the "npm-publish" environment and publishes the
#                          exact signed tarball to npm with provenance.
#
# One-time setup (see docs/RELEASING.md): make the repository public, create the "npm-publish" environment with required
# reviewers, and add an NPM_TOKEN secret (an automation/granular token limited to this package), or configure npm trusted publishing.
#
# Third-party actions are pinned to commit SHAs (the version is in the comment). Update them deliberately.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after the build (needs approval of the npm-publish environment). Must be run on a tag."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run test:release

  build:
    name: build and sign the tarball
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Sigstore signing: the signature names this workflow as the signer
    outputs:
      dir: ${{ steps.pack.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: npm ci
      - run: npm run build
      - name: Pack, checksum and sign
        id: pack
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=(--sign required --skip-tests)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          node scripts/release.mjs pack "${args[@]}"
          dir=$(ls -d release/*/ | head -n1)
          echo "dir=${dir%/}" >> "$GITHUB_OUTPUT"
      - name: Verify what was just signed
        env:
          REPO: ${{ github.repository }}
          DIR: ${{ steps.pack.outputs.dir }}
        run: |
          identity="^https://github\\.com/${REPO//./\\.}/\\.github/workflows/release\\.yml@refs/(tags|heads)/"
          node scripts/release.mjs verify "$DIR" --identity "$identity" --issuer https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: draft GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates a DRAFT release; you publish it by hand after looking at it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create draft release with the signed files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIR: ${{ needs.build.outputs.dir }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" \
            --notes "Draft created by the release workflow. Verify with docs/RELEASING.md before publishing." \
            "$DIR"/*.tgz "$DIR"/SHA256SUMS "$DIR"/SHA256SUMS.sigstore.json

  publish:
    name: publish to npm (needs approval)
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish # add required reviewers to this environment in the repository settings
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Re-verify checksums and signature before publishing
        env:
          REPO: ${{ github.repository }}
          DIR: ${{ needs.build.outputs.dir }}
        run: |
          cd "$DIR"
          sha256sum -c SHA256SUMS
          identity="^https://github\\.com/${REPO//./\\.}/\\.github/workflows/release\\.yml@refs/tags/v"
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: Publish the signed tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIR: ${{ needs.build.outputs.dir }}
        run: |
          tgz=$(ls "$DIR"/*.tgz)
          npm publish "$tgz" --access public --provenance
